<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chrono EPS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg:#0f1117; --surface:#1a1d27; --card:#22263a; --accent:#3dd68c;
  --orange:#fb923c; --red:#f87171; --text:#f1f5f9; --muted:#94a3b8; --border:#2e3347;
}
html,body { height:100%; width:100%; background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',sans-serif; overflow:hidden; }
.screen { display:none; flex-direction:column; height:100dvh; }
.screen.active { display:flex; }
#screen-setup { padding:24px 20px; overflow-y:auto; gap:14px; }
.setup-logo { text-align:center; padding:8px 0; }
.setup-logo .title { font-size:22px; font-weight:700; color:var(--accent); }
.setup-logo .sub { font-size:13px; color:var(--muted); margin-top:4px; }
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:12px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.field input { background:var(--card); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:16px; padding:13px 14px; outline:none; width:100%; }
.field input:focus { border-color:var(--accent); }
.field input::placeholder { color:var(--muted); }
.field .hint { font-size:11px; color:var(--muted); line-height:1.5; }
.btn-big { width:100%; padding:16px; border-radius:14px; border:none; font-size:17px; font-weight:700; cursor:pointer; transition:transform .1s; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-big:active { transform:scale(.97); }
.btn-accent { background:var(--accent); color:#0f1117; }
.btn-surface { background:var(--card); color:var(--text); border:1.5px solid var(--border); }
.divider { height:1px; background:var(--border); margin:2px 0; }
#screen-home { padding:0; }
.home-header { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 18px 12px; display:flex; align-items:center; justify-content:space-between; }
.home-header .sn { font-size:14px; font-weight:600; color:var(--accent); max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.home-header .ck { font-family:monospace; font-size:17px; font-weight:500; }
.home-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.btn-depart { width:100%; border-radius:20px; border:none; cursor:pointer; background:linear-gradient(135deg,#1a472a,#166534); box-shadow:0 4px 24px rgba(61,214,140,.18); transition:transform .1s; }
.btn-depart:active { transform:scale(.97); }
.btn-depart-inner { padding:28px 20px; display:flex; flex-direction:column; align-items:center; gap:6px; }
.btn-depart .icon { font-size:40px; }
.btn-depart .lbl { font-size:22px; font-weight:800; color:var(--accent); }
.btn-depart .sub { font-size:12px; color:#86efac; opacity:.8; }
#running-bar { background:var(--card); border:1.5px solid var(--accent); border-radius:16px; padding:14px 16px; display:none; flex-direction:column; gap:10px; }
.rl { font-size:11px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; }
.rt { font-family:monospace; font-size:42px; font-weight:700; text-align:center; }
.ra { display:flex; gap:10px; }
.btn-scan { flex:2; padding:14px; border-radius:12px; border:none; background:var(--accent); color:#0f1117; font-size:16px; font-weight:700; cursor:pointer; }
.btn-stop { flex:1; padding:14px; border-radius:12px; border:1.5px solid var(--red); background:transparent; color:var(--red); font-size:14px; font-weight:600; cursor:pointer; }
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.stat-mini { background:var(--surface); border-radius:12px; padding:12px 8px; text-align:center; border:1px solid var(--border); }
.stat-mini .val { font-family:monospace; font-size:22px; font-weight:700; }
.stat-mini .lbl { font-size:10px; color:var(--muted); margin-top:2px; }
.log-title { font-size:11px; color:var(--muted); letter-spacing:.08em; }
.log-list { display:flex; flex-direction:column; gap:6px; }
.log-item { background:var(--card); border-radius:12px; padding:10px 14px; display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px; animation:pop-in .2s ease; border:1px solid transparent; }
.log-item.fresh { border-color:var(--accent); }
@keyframes pop-in { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
.li-name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li-temps { font-family:monospace; font-size:14px; color:var(--accent); }
.li-heure { font-family:monospace; font-size:11px; color:var(--muted); }
.bottom-bar { background:var(--surface); border-top:1px solid var(--border); padding:10px 16px 20px; display:flex; gap:10px; }
#screen-scan { background:#000; position:relative; }
#video-scan { width:100%; height:100%; object-fit:cover; display:block; }
#canvas-scan { display:none; }
.scan-overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
.scan-frame { width:220px; height:220px; position:relative; }
.sc { position:absolute; width:32px; height:32px; border-color:var(--accent); border-style:solid; opacity:.9; }
.sc.tl{top:0;left:0;border-width:3px 0 0 3px} .sc.tr{top:0;right:0;border-width:3px 3px 0 0}
.sc.bl{bottom:0;left:0;border-width:0 0 3px 3px} .sc.br{bottom:0;right:0;border-width:0 3px 3px 0}
.scan-line { position:absolute; left:8px; right:8px; height:2px; background:var(--accent); opacity:.7; animation:sa 1.8s ease-in-out infinite; }
@keyframes sa{0%{top:12px}50%{top:calc(100% - 14px)}100%{top:12px}}
.scan-cd { font-family:monospace; font-size:48px; font-weight:700; color:var(--accent); text-shadow:0 0 30px rgba(61,214,140,.4); }
.scan-lbl { color:var(--text); font-size:15px; font-weight:600; background:rgba(0,0,0,.6); padding:8px 20px; border-radius:20px; }
.scan-close { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); padding:14px 36px; border-radius:30px; background:rgba(30,33,50,.85); border:1.5px solid var(--border); color:var(--text); font-size:16px; font-weight:600; cursor:pointer; }
#scan-flash { position:absolute; inset:0; background:var(--accent); opacity:0; pointer-events:none; transition:opacity .08s; }
#scan-flash.show { opacity:.2; }
#scan-result { position:absolute; top:20px; left:50%; transform:translateX(-50%); background:rgba(15,17,23,.9); border:1.5px solid var(--accent); border-radius:16px; padding:14px 24px; text-align:center; min-width:200px; display:none; }
#screen-ios-result { align-items:center; justify-content:center; padding:32px 24px; gap:20px; text-align:center; }
.big-name  { font-size:36px; font-weight:800; color:var(--accent); }
.big-temps { font-family:monospace; font-size:52px; font-weight:700; }
.big-info  { font-size:14px; color:var(--muted); }
#toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--border); font-size:13px; padding:10px 18px; border-radius:20px; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; z-index:999; }
#toast.show { opacity:1; }
#camera-input { position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
</style>
</head>
<body>
<input type="file" id="camera-input" accept="image/*" capture="environment">
<div id="toast"></div>

<div class="screen active" id="screen-setup">
  <div class="setup-logo"><div class="title">Chrono EPS</div><div class="sub">Version téléphone — multi-profs</div></div>
  <div class="field"><label>Nom de la session</label><input type="text" id="s-session" placeholder="ex : Cross 3e A – 14 nov"></div>
  <div class="field"><label>Ton prénom</label><input type="text" id="s-prof" placeholder="ex : Marc"><div class="hint">Apparaîtra dans Google Sheets.</div></div>
  <div class="field"><label>URL Webhook Google Sheets</label><input type="url" id="s-webhook" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="field"><label>Cooldown même élève (s)</label><input type="number" id="s-cooldown" value="8" min="2" max="60"></div>
  <div class="divider"></div>
  <button class="btn-big btn-accent" onclick="startSession()">Démarrer ›</button>
</div>

<div class="screen" id="screen-home">
  <div class="home-header"><div class="sn" id="h-session">—</div><div class="ck" id="h-clock">00:00:00</div></div>
  <div class="home-body">
    <button class="btn-depart" onclick="toggleDepart()">
      <div class="btn-depart-inner"><div class="icon">🏁</div><div class="lbl" id="dep-lbl">DÉPART</div><div class="sub" id="dep-sub">Appuie au signal de départ</div></div>
    </button>
    <div id="running-bar">
      <div class="rl">⏱ CHRONO EN COURS</div>
      <div class="rt" id="running-time">00:00.0</div>
      <div class="ra">
        <button class="btn-scan" onclick="lancerScan()">📷 Scanner l'arrivée</button>
        <button class="btn-stop" onclick="stopChrono()">Arrêter</button>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-mini"><div class="val" id="st-passages">0</div><div class="lbl">passages</div></div>
      <div class="stat-mini"><div class="val" id="st-eleves">0</div><div class="lbl">élèves</div></div>
      <div class="stat-mini"><div class="val" id="st-sync" style="font-size:16px">—</div><div class="lbl">sync</div></div>
    </div>
    <div class="log-title">DERNIERS PASSAGES</div>
    <div class="log-list" id="log-list"><div style="text-align:center;color:var(--muted);font-size:13px;padding:20px 0">Aucun passage encore</div></div>
  </div>
  <div class="bottom-bar">
    <button class="btn-big btn-surface" style="flex:1;padding:12px;font-size:14px" onclick="exportCSV()">CSV</button>
    <button class="btn-big btn-surface" style="flex:1;padding:12px;font-size:14px" onclick="syncAll()">↑ Sync</button>
    <button class="btn-big btn-surface" style="flex:1;padding:12px;font-size:14px" onclick="showSetup()">⚙</button>
  </div>
</div>

<div class="screen" id="screen-scan">
  <video id="video-scan" autoplay playsinline muted></video>
  <canvas id="canvas-scan"></canvas>
  <div id="scan-flash"></div>
  <div id="scan-result">
    <div style="font-size:22px;font-weight:700;color:var(--accent)" id="sr-name">—</div>
    <div style="font-family:monospace;font-size:28px;font-weight:700;margin-top:4px" id="sr-temps">—</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px" id="sr-info">—</div>
  </div>
  <div class="scan-overlay">
    <div class="scan-cd" id="scan-chrono">00:00.0</div>
    <div class="scan-frame">
      <div class="sc tl"></div><div class="sc tr"></div><div class="sc bl"></div><div class="sc br"></div>
      <div class="scan-line"></div>
    </div>
    <div class="scan-lbl">Approche le QR code de l'élève</div>
  </div>
  <button class="scan-close" onclick="closeScan()">Fermer sans scanner</button>
</div>

<div class="screen" id="screen-ios-result">
  <div style="font-size:60px">✅</div>
  <div class="big-name"  id="ios-name">—</div>
  <div class="big-temps" id="ios-temps">—</div>
  <div class="big-info"  id="ios-info">—</div>
  <button class="btn-big btn-accent" style="margin-top:16px;max-width:320px" onclick="show('screen-home')">Scanner l'élève suivant →</button>
</div>

<script>
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
let nativeDetector = null;
if ('BarcodeDetector' in window) {
  try { nativeDetector = new BarcodeDetector({ formats: ['qr_code'] }); } catch(e) {}
}

let cfg={}, passages=[], lastScan={}, departTime=null, chronoInterval=null, scanActive=false, videoStream=null, scanRAF=null;

function updateClock() {
  const n=new Date();
  document.getElementById('h-clock').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');
}
setInterval(updateClock,1000); updateClock();

function startSession() {
  const s=document.getElementById('s-session').value.trim();
  const p=document.getElementById('s-prof').value.trim();
  if(!s){toast('Donne un nom à la session');return;}
  if(!p){toast('Indique ton prénom');return;}
  cfg={session:s,prof:p,webhook:document.getElementById('s-webhook').value.trim(),cooldown:parseInt(document.getElementById('s-cooldown').value)||8};
  document.getElementById('h-session').textContent=s+' · '+p;
  show('screen-home');
}
function showSetup(){show('screen-setup');}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function toggleDepart() {
  if(departTime&&!confirm('Nouveau départ ? Le chrono repart à zéro.'))return;
  departTime=Date.now();
  document.getElementById('dep-lbl').textContent='NOUVEAU DÉPART';
  document.getElementById('dep-sub').textContent='Chrono en cours';
  document.getElementById('running-bar').style.display='flex';
  clearInterval(chronoInterval);
  chronoInterval=setInterval(()=>{
    const e=Date.now()-departTime;
    document.getElementById('running-time').textContent=fmt(e);
    if(scanActive)document.getElementById('scan-chrono').textContent=fmt(e);
  },100);
}
function stopChrono(){
  if(!confirm('Arrêter le chrono ?'))return;
  clearInterval(chronoInterval);departTime=null;
  document.getElementById('running-bar').style.display='none';
  document.getElementById('dep-lbl').textContent='DÉPART';
  document.getElementById('dep-sub').textContent='Appuie au signal de départ';
}
function fmt(ms){const t=Math.floor(ms/100);return String(Math.floor(t/600)).padStart(2,'0')+':'+String(Math.floor(t/10)%60).padStart(2,'0')+'.'+t%10;}

function lancerScan(){
  if(!departTime){toast('Lance d\'abord le chrono avec DÉPART');return;}
  if(isIOS){lancerScanIOS();}else{lancerScanAndroid();}
}

function lancerScanIOS(){
  const input=document.getElementById('camera-input');
  input.value='';
  input.onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    // Essai BarcodeDetector sur image statique
    if(nativeDetector){
      try{
        const bm=await createImageBitmap(file);
        const codes=await nativeDetector.detect(bm);
        if(codes.length>0){traiterScan(codes[0].rawValue.trim());return;}
      }catch(err){}
    }
    // Fallback jsQR
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0);
      const id=ctx.getImageData(0,0,c.width,c.height);
      const code=jsQR(id.data,id.width,id.height,{inversionAttempts:'attemptBoth'});
      if(code){traiterScan(code.data.trim());}else{toast('QR non reconnu — réessaie en cadrant mieux');}
      URL.revokeObjectURL(img.src);
    };
    img.src=URL.createObjectURL(file);
  };
  input.click();
}

async function lancerScanAndroid(){
  show('screen-scan');scanActive=true;
  document.getElementById('scan-chrono').textContent=fmt(Date.now()-departTime);
  try{
    videoStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}}});
    const v=document.getElementById('video-scan');v.srcObject=videoStream;
    v.addEventListener('loadedmetadata',()=>{v.play();scanRAF=requestAnimationFrame(boucleAndroid);},{once:true});
  }catch(e){toast('Caméra refusée');closeScan();}
}
function closeScan(){
  scanActive=false;if(scanRAF)cancelAnimationFrame(scanRAF);
  if(videoStream){videoStream.getTracks().forEach(t=>t.stop());videoStream=null;}
  show('screen-home');
}
const vS=document.getElementById('video-scan');
const cS=document.getElementById('canvas-scan');
const ctxS=cS.getContext('2d',{willReadFrequently:true});
async function boucleAndroid(){
  if(!scanActive)return;
  if(vS.readyState>=2){
    if(nativeDetector){
      try{const c=await nativeDetector.detect(vS);if(c.length>0){traiterScan(c[0].rawValue.trim());return;}}catch(e){}
    }else{
      cS.width=vS.videoWidth;cS.height=vS.videoHeight;ctxS.drawImage(vS,0,0);
      const id=ctxS.getImageData(0,0,cS.width,cS.height);
      const code=jsQR(id.data,id.width,id.height,{inversionAttempts:'attemptBoth'});
      if(code){traiterScan(code.data.trim());return;}
    }
  }
  if(scanActive)scanRAF=requestAnimationFrame(boucleAndroid);
}

function traiterScan(eleve){
  const now=Date.now();if(!departTime)return;
  if(now-(lastScan[eleve]||0)<cfg.cooldown*1000){toast(eleve+' — cooldown actif');if(!isIOS)closeScan();return;}
  lastScan[eleve]=now;
  const elapsed=now-departTime,temps=fmt(elapsed),heure=new Date().toLocaleTimeString('fr-FR'),horodatage=new Date().toISOString();
  const passage={eleve,temps,elapsedMs:elapsed,heure,horodatage,prof:cfg.prof,session:cfg.session,synced:false};
  passages.unshift(passage);
  if(navigator.vibrate)navigator.vibrate([60,30,60]);
  if(isIOS){
    document.getElementById('ios-name').textContent=eleve;
    document.getElementById('ios-temps').textContent=temps;
    document.getElementById('ios-info').textContent=heure+' · '+cfg.prof;
    show('screen-ios-result');
  }else{
    const f=document.getElementById('scan-flash');f.classList.add('show');setTimeout(()=>f.classList.remove('show'),180);
    document.getElementById('sr-name').textContent=eleve;
    document.getElementById('sr-temps').textContent=temps;
    document.getElementById('sr-info').textContent=heure+' · '+cfg.prof;
    document.getElementById('scan-result').style.display='block';
    setTimeout(()=>{document.getElementById('scan-result').style.display='none';closeScan();},2000);
  }
  addLogItem(passage);updateStats();if(cfg.webhook)sendToSheets(passage);
}

function addLogItem(p){
  const list=document.getElementById('log-list');
  if(list.children.length===1&&list.children[0].style.textAlign==='center')list.innerHTML='';
  const item=document.createElement('div');item.className='log-item fresh';
  item.innerHTML='<div class="li-name">'+esc(p.eleve)+'</div><div class="li-temps">'+p.temps+'</div><div class="li-heure">'+p.heure+'</div>';
  list.prepend(item);setTimeout(()=>item.classList.remove('fresh'),1200);
  while(list.children.length>30)list.removeChild(list.lastChild);
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function updateStats(){
  document.getElementById('st-passages').textContent=passages.length;
  document.getElementById('st-eleves').textContent=new Set(passages.map(p=>p.eleve)).size;
  const u=passages.filter(p=>!p.synced).length;
  const el=document.getElementById('st-sync');el.textContent=u===0?'✓':u+'↑';
  el.style.color=u===0?'var(--accent)':'var(--orange)';
}
async function sendToSheets(p){
  if(!cfg.webhook)return;
  try{await fetch(cfg.webhook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({session:p.session,prof:p.prof,eleve:p.eleve,temps:p.temps,elapsedMs:p.elapsedMs,heure:p.heure,horodatage:p.horodatage})});p.synced=true;updateStats();}catch(e){}
}
async function syncAll(){
  const u=passages.filter(p=>!p.synced);if(!u.length){toast('Tout synchronisé ✓');return;}
  if(!cfg.webhook){toast('Aucun webhook configuré');return;}
  toast('Envoi de '+u.length+' passage(s)…');for(const p of u)await sendToSheets(p);toast('Synchronisation terminée ✓');
}
function exportCSV(){
  if(!passages.length){toast('Aucun passage enregistré');return;}
  const h='Session,Prof,Élève,Temps,Millisecondes,Heure,Horodatage ISO\n';
  const r=[...passages].reverse().map(p=>`"${p.session}","${p.prof}","${p.eleve}","${p.temps}",${p.elapsedMs},"${p.heure}","${p.horodatage}"`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h+r],{type:'text/csv;charset=utf-8;'}));
  a.download='chrono-'+cfg.session.replace(/\s+/g,'-')+'-'+cfg.prof+'.csv';a.click();
}
function toast(msg,d=2200){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),d);}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
</body>
</html>
